name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Keep the Gmail credential in the relay. Only its public HTTPS URL
          # is exposed to this static client at build time.
          VITE_GOOGLE_MAIL_API: ${{ vars.VITE_GOOGLE_MAIL_API || secrets.VITE_GOOGLE_MAIL_API || vars.GOOGLE_MAIL_API || secrets.GOOGLE_MAIL_API || vars.VITE_GMAIL_API || secrets.VITE_GMAIL_API || vars.VITE_GMAIL_API_URL || secrets.VITE_GMAIL_API_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
